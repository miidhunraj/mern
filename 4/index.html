<html>
<body>
 <button onclick="sendData()">Submit JSON</button>
 <script>
 function sendData()
 {
 fetch('http://localhost:3000/submit',
 {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ name: "BCA", section:"A" })
 })
 .then(res => res.json())
 .then(data => alert('Response:'+JSON.stringify(data)));
 }
 </script>
</body>
</html>
